<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="VoiceHive">
  <defs>
    <linearGradient id="vh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5865f2"/>
      <stop offset="0.55" stop-color="#6d7bf7"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#vh)"/>

  <!-- honeycomb shell -->
  <path d="M64 17 L104 40 V88 L64 111 L24 88 V40 Z"
        fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linejoin="round" opacity="0.95"/>

  <!-- voice bars -->
  <g fill="#ffffff">
    <rect x="42" y="52" width="8" height="24" rx="4"/>
    <rect x="54" y="42" width="8" height="44" rx="4"/>
    <rect x="66" y="47" width="8" height="34" rx="4"/>
    <rect x="78" y="56" width="8" height="16" rx="4"/>
  </g>
</svg>
